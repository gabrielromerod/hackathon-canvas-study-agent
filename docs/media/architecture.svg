<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 760" width="1800" height="760" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Canvas Study Agent architecture</title>
  <desc>Canvas pages are read into a Chrome side panel; a service worker grounds the prompt; a model worker runs Gemma 4 E2B through LiteRT-LM on WebGPU on the user's GPU; the answer streams back with citations. Weights are downloaded once from Hugging Face.</desc>
  <defs>
    <marker id="ar" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#FFFFFF"/></marker>
    <marker id="aa" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#FBBF24"/></marker>
    <marker id="ag" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#5E918A"/></marker>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="14"/></filter>
    <linearGradient id="eng" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#17265A"/><stop offset="1" stop-color="#0E3A3A"/></linearGradient>
  </defs>

  <rect width="1800" height="760" fill="#0F2A30"/>

  <!-- browser boundary -->
  <rect x="260" y="40" width="1520" height="560" rx="36" fill="#12343A" stroke="#6EE7B7" stroke-width="3" stroke-opacity="0.9"/>
  <text x="300" y="540" font-size="24" font-weight="700" fill="#6EE7B7" letter-spacing="3">YOUR BROWSER</text>
  <text x="300" y="575" font-size="24" font-weight="700" fill="#6EE7B7" letter-spacing="3">YOUR DEVICE</text>

  <!-- Canvas (outside) -->
  <rect x="20" y="200" width="210" height="190" rx="24" fill="#163B40" stroke="#D94B43" stroke-width="3"/>
  <circle cx="125" cy="250" r="30" fill="#8C1D18"/>
  <text x="125" y="262" font-size="31" font-weight="700" fill="#FFFFFF" text-anchor="middle">C</text>
  <text x="125" y="320" font-size="30" font-weight="700" fill="#FFFFFF" text-anchor="middle">Canvas</text>
  <text x="125" y="354" font-size="23" fill="#A9C7C0" text-anchor="middle">your course</text>
  <text x="125" y="440" font-size="23" fill="#A9C7C0" text-anchor="middle">read with your</text>
  <text x="125" y="472" font-size="23" fill="#A9C7C0" text-anchor="middle">own login</text>

  <!-- 1 Canvas -> panel -->
  <line x1="232" y1="295" x2="288" y2="295" stroke="#FFFFFF" stroke-width="4" marker-end="url(#ar)"/>
  <circle cx="260" cy="250" r="21" fill="#6EE7B7"/><text x="260" y="258" font-size="21" font-weight="700" fill="#0F2A30" text-anchor="middle">1</text>

  <!-- Side panel -->
  <rect x="290" y="180" width="250" height="230" rx="24" fill="#184248" stroke="#6EE7B7" stroke-width="3"/>
  <circle cx="330" cy="225" r="14" fill="#6EE7B7"/>
  <text x="315" y="300" font-size="31" font-weight="700" fill="#FFFFFF">Side panel</text>
  <text x="315" y="341" font-size="23" fill="#A9C7C0">Chat and scope</text>
  <text x="315" y="375" font-size="23" fill="#A9C7C0">Citations [S#]</text>

  <!-- 2 panel -> service worker -->
  <line x1="542" y1="295" x2="608" y2="295" stroke="#FFFFFF" stroke-width="4" marker-end="url(#ar)"/>
  <circle cx="575" cy="250" r="21" fill="#6EE7B7"/><text x="575" y="258" font-size="21" font-weight="700" fill="#0F2A30" text-anchor="middle">2</text>

  <!-- Service worker -->
  <rect x="610" y="180" width="280" height="230" rx="24" fill="#184248" stroke="#5E918A" stroke-width="3"/>
  <circle cx="650" cy="225" r="14" fill="#5E918A"/>
  <text x="635" y="300" font-size="31" font-weight="700" fill="#FFFFFF">Service worker</text>
  <text x="635" y="341" font-size="23" fill="#A9C7C0">Ranks your excerpts</text>
  <text x="635" y="375" font-size="23" fill="#A9C7C0">6,144-token budget</text>

  <!-- 3 service worker -> model worker -->
  <line x1="892" y1="295" x2="958" y2="295" stroke="#FFFFFF" stroke-width="4" marker-end="url(#ar)"/>
  <circle cx="925" cy="250" r="21" fill="#6EE7B7"/><text x="925" y="258" font-size="21" font-weight="700" fill="#0F2A30" text-anchor="middle">3</text>

  <!-- Model worker -->
  <rect x="960" y="180" width="260" height="230" rx="24" fill="#184248" stroke="#5E918A" stroke-width="3"/>
  <circle cx="1000" cy="225" r="14" fill="#5E918A"/>
  <text x="985" y="300" font-size="31" font-weight="700" fill="#FFFFFF">Model worker</text>
  <text x="985" y="341" font-size="23" fill="#A9C7C0">Offscreen host</text>
  <text x="985" y="375" font-size="23" fill="#A9C7C0">Streams tokens</text>

  <!-- 4 worker -> engine -->
  <line x1="1222" y1="295" x2="1288" y2="295" stroke="#FFFFFF" stroke-width="4" marker-end="url(#ar)"/>
  <circle cx="1255" cy="250" r="21" fill="#6EE7B7"/><text x="1255" y="258" font-size="21" font-weight="700" fill="#0F2A30" text-anchor="middle">4</text>

  <!-- 5 return path -->
  <path d="M1090 178 L1090 122 L415 122 L415 176" fill="none" stroke="#FBBF24" stroke-width="4" stroke-dasharray="14 10" marker-end="url(#aa)"/>
  <circle cx="450" cy="86" r="21" fill="#FBBF24"/><text x="450" y="94" font-size="21" font-weight="700" fill="#0F2A30" text-anchor="middle">5</text>
  <text x="486" y="96" font-size="26" font-weight="700" fill="#FBBF24">Streamed answer · sources [S#] · memory [M#]</text>

  <!-- Storage -->
  <line x1="750" y1="412" x2="750" y2="468" stroke="#5E918A" stroke-width="3" marker-start="url(#ag)" marker-end="url(#ag)"/>
  <rect x="610" y="470" width="280" height="90" rx="20" fill="#184248" stroke="#5E918A" stroke-width="2.5" stroke-dasharray="8 6"/>
  <text x="750" y="510" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle">IndexedDB</text>
  <text x="750" y="543" font-size="22" fill="#A9C7C0" text-anchor="middle">courses · chats · memory</text>

  <line x1="1090" y1="412" x2="1090" y2="468" stroke="#5E918A" stroke-width="3" marker-start="url(#ag)" marker-end="url(#ag)"/>
  <rect x="960" y="470" width="260" height="90" rx="20" fill="#184248" stroke="#5E918A" stroke-width="2.5" stroke-dasharray="8 6"/>
  <text x="1090" y="510" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle">OPFS</text>
  <text x="1090" y="543" font-size="22" fill="#A9C7C0" text-anchor="middle">2.01 GB weights</text>

  <!-- Engine cluster -->
  <rect x="1290" y="130" width="460" height="430" rx="30" fill="#3B6FE0" opacity="0.55" filter="url(#glow)"/>
  <rect x="1290" y="130" width="460" height="430" rx="30" fill="url(#eng)" stroke="#3B6FE0" stroke-width="4"/>
  <rect x="1315" y="153" width="410" height="92" rx="22" fill="#3B6FE0"/>
  <text x="1520" y="203" font-size="35" font-weight="700" fill="#FFFFFF" text-anchor="middle">Gemma 4 E2B</text>
  <text x="1520" y="233" font-size="23" fill="#DCE6FF" text-anchor="middle">open weights · Apache 2.0</text>
  <path d="M1505 256 L1535 256 L1520 274 Z" fill="#A9C7C0"/>
  <rect x="1315" y="282" width="410" height="80" rx="20" fill="#1D4A50" stroke="#5E918A" stroke-width="2"/>
  <text x="1520" y="326" font-size="31" font-weight="700" fill="#FFFFFF" text-anchor="middle">LiteRT-LM 0.18</text>
  <text x="1520" y="352" font-size="22" fill="#A9C7C0" text-anchor="middle">runs in a browser worker</text>
  <path d="M1505 372 L1535 372 L1520 390 Z" fill="#A9C7C0"/>
  <rect x="1315" y="398" width="410" height="80" rx="20" fill="#0B7F73"/>
  <text x="1520" y="442" font-size="35" font-weight="700" fill="#FFFFFF" text-anchor="middle">WebGPU</text>
  <text x="1520" y="468" font-size="22" fill="#D5F3EF" text-anchor="middle">GPU compute, built into Chrome</text>
  <rect x="1380" y="494" width="280" height="50" rx="14" fill="none" stroke="#FBBF24" stroke-width="3"/>
  <text x="1520" y="530" font-size="26" font-weight="700" fill="#FBBF24" text-anchor="middle" letter-spacing="2">YOUR GPU</text>

  <!-- Hugging Face (outside) -->
  <line x1="1090" y1="656" x2="1090" y2="564" stroke="#5E918A" stroke-width="3.5" stroke-dasharray="10 8" marker-end="url(#ag)"/>
  <rect x="930" y="660" width="320" height="80" rx="20" fill="#163B40" stroke="#5E918A" stroke-width="2.5"/>
  <text x="1090" y="699" font-size="30" font-weight="700" fill="#FFFFFF" text-anchor="middle">Hugging Face</text>
  <text x="1090" y="727" font-size="22" fill="#A9C7C0" text-anchor="middle">weights host</text>
  <text x="1115" y="637" font-size="23" fill="#A9C7C0">one-time download · SHA-256 verified</text>

  <!-- Privacy badge -->
  <rect x="20" y="640" width="640" height="100" rx="24" fill="#12382F" stroke="#3DDC97" stroke-width="3"/>
  <circle cx="80" cy="690" r="26" fill="#3DDC97"/>
  <path d="M66 691 L76 701 L95 680" fill="none" stroke="#12382F" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="125" y="686" font-size="30" font-weight="700" fill="#3DDC97">No prompt leaves your device</text>
  <text x="125" y="722" font-size="23" fill="#BDEBD6">no chat API · no API key · no server</text>
</svg>
